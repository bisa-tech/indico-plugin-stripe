[tool:pytest]
indico_plugins = payment_stripe

[flake8]
max-line-length = 80

[bdist_wheel]
universal = 1

[metadata]
name = indico-plugin-payment-stripe
version = 0.0.2
description = Stripe payment support plugin for the Indico conference management system.
long_description = file: README.rst
long_description_content_type = text/x-rst
url = https://github.com/neicnordic/indico-plugin-stripe
license = MIT
author = NeIC
author_email = indico-team@cern.ch
classifiers =
    Environment :: Plugins
    Environment :: Web Environment
    Programming Language :: Python :: 3.9

[options]
packages = find:
zip_safe = false
include_package_data = true
python_requires = >=3.9.0, <3.11
install_requires =
    indico>=3.1.1
    stripe==3.5.0
    requests[security]

[options.entry_points]
indico.plugins =
    payment_stripe = indico_payment_stripe.plugin:StripePaymentPlugin
